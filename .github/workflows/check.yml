name: 提交检查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 检查正式区改动
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config core.quotepath false
          if [ "$EVENT" = "pull_request" ]; then
            commits=$(git rev-list --no-merges "$PR_BASE..$PR_HEAD")
          elif [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            commits=$(git rev-list --no-merges -1 "$AFTER")
          else
            commits=$(git rev-list --no-merges "$BEFORE..$AFTER")
          fi
          fail=0
          for c in $commits; do
            msg=$(git log -1 --format=%B "$c")
            subject=$(git log -1 --format='%h %s' "$c")
            if git diff-tree --no-commit-id --name-only -r "$c" | grep -q '^正式/'; then
              if ! printf '%s\n' "$msg" | grep -q '审核通过'; then
                echo "::error::改动了 正式/ 但提交说明没有“审核通过” —— $subject"
                fail=1
              fi
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "模型不能直接改 正式/，请交到 待审/；审核人并入正式区时在提交说明里写“审核通过”。"
            exit 1
          fi
          echo "正式区检查通过。"
